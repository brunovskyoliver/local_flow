[workspace]
resolver = "3"
members = ["crates/flow-ui", "crates/flow-core", "crates/flow-platform", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
gpui-kit = "=0.8.1"
flow-ui = { path = "crates/flow-ui" }
flow-core = { path = "crates/flow-core" }
flow-platform = { path = "crates/flow-platform" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
