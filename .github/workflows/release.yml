name: Release macOS app
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Check build tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          brew install cmake
      - name: Validate repository
        run: make check
      - name: Package ad-hoc signed application
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-macos.sh "${RELEASE_TAG#v}" "$BUILD_NUMBER"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" --verify-tag \
            "build/distribution/$version/LocalFlow-$version-arm64.zip" \
            "build/distribution/$version/LocalFlow-$version-arm64.zip.sha256" \
            "build/distribution/$version/localflow.rb" \
            --title "LocalFlow $version" --notes-file docs/distribution/release-notes.md
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-diagnostics
          path: build/DerivedData/Logs/Test
          if-no-files-found: ignore
