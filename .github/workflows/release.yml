name: Release macOS app
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Check build tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          brew install cmake
      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Package signed and notarized application
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          # The production iOS OAuth client (not secret); without it Google sign-in is hidden.
          LOCALFLOW_GOOGLE_CLIENT_ID: ${{ vars.LOCALFLOW_GOOGLE_CLIENT_ID }}
          LOCALFLOW_SIGNING_IDENTITY: 'Developer ID Application: e-Net, s.r.o. (944A459UC3)'
          LOCALFLOW_NOTARY_APPLE_ID: ${{ vars.NOTARY_APPLE_ID }}
          LOCALFLOW_NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          LOCALFLOW_NOTARY_TEAM_ID: 944A459UC3
        run: |
          mkdir -p build
          ./scripts/package-macos.sh "${RELEASE_TAG#v}" "$BUILD_NUMBER" 2>&1 | tee build/release-build.log
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" --verify-tag \
            "build/distribution/$version/LocalFlow-$version-arm64.zip" \
            "build/distribution/$version/LocalFlow-$version-arm64.zip.sha256" \
            "build/distribution/$version/localflow.rb" \
            --title "LocalFlow $version" --notes-file docs/distribution/release-notes.md
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-diagnostics
          path: build/release-build.log
          if-no-files-found: ignore
